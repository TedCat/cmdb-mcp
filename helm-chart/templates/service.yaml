{{- if .Values.service.create -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmdb-mcp.fullname" . }}
  labels:
    {{- include "cmdb-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "cmdb-mcp.selectorLabels" . | nindent 4 }}
{{- end }}
